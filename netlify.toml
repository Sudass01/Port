# ==========================================================================
# NETLIFY
# O Netlify detecta o Next.js e instala sozinho o runtime necessário.
# Não é preciso instalar nada na sua máquina: o build acontece no servidor
# deles a cada vez que o repositório do GitHub muda.
# ==========================================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Evita que uma versão nova do npm mude o comportamento da instalação.
  NPM_FLAGS = "--no-audit --no-fund"

# Cache longo para os arquivos com hash no nome (gerados pelo Next).
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cabeçalhos de segurança básicos.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
